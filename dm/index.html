<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstagramDM 稼働量ダッシュボード</title>
<style>
:root{
  --accent:#7b61ff; --accent-soft:#efeaff; --accent-2:#b8abff;
  --bg:#f4f3fa; --card:#ffffff; --ink:#1c1b29; --ink2:#6b6980; --ink3:#9d9bb0;
  --line:#eceaf4; --good:#16a06a; --good-bg:#e6f6ef; --bad:#e2544f; --bad-bg:#fdecec;
  --radius:16px; --shadow:0 1px 3px rgba(30,25,60,.05);
}
:root[data-theme=dark]{
  --accent:#8f7bff; --accent-soft:#2a2547; --accent-2:#5b4fa8;
  --bg:#141320; --card:#1e1c2e; --ink:#f0eefb; --ink2:#a6a3c0; --ink3:#75729a;
  --line:#2b2940; --good:#4cd196; --good-bg:#173a2c; --bad:#f0817d; --bad-bg:#3a1f1f;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;padding:18px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:14px;padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--accent);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:var(--card);color:var(--ink2);cursor:pointer;font-size:16px;box-shadow:var(--shadow)}
.hello{font-size:22px;font-weight:700;margin:2px 0 2px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.cards4{grid-template-columns:repeat(4,1fr)}
.cards3{grid-template-columns:repeat(3,1fr)}
.secLab{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px 2px}
.two{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.stat .lab{color:var(--ink2);font-size:13px;font-weight:600}
.stat .val{font-size:26px;font-weight:800;margin:8px 0 8px;letter-spacing:-.5px}
.stat .val small{font-size:14px;color:var(--ink3);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge.up{color:var(--good);background:var(--good-bg)}
.badge.down{color:var(--bad);background:var(--bad-bg)}
.badge.flat{color:var(--ink2);background:var(--line)}
.h{font-size:16px;font-weight:700;margin:0 0 2px}
.hsub{color:var(--ink3);font-size:12px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--ink3);font-weight:600;font-size:11px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.tbl th.num{text-align:right}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--ink)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.bar{height:9px;border-radius:20px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:26px 0}
.win{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.win:last-child{border-bottom:0}
.rank{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}
.win .n{font-weight:600;font-size:14px;flex:1}
.win .m{color:var(--ink3);font-size:12px}
@media(max-width:820px){.cards4{grid-template-columns:1fr 1fr}.cards3{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">DM</div>InstagramDM 稼働量</div>
    <div class="tabs" id="tabs"></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="refresh" title="更新">⟳</button>
      <button class="iconbtn" id="theme" title="テーマ">☾</button>
    </div>
  </div>

  <div class="hello" id="hello">稼働量</div>
  <div class="sub" id="sub">読み込み中…</div>

  <div class="grid cards4" id="stats" style="margin-bottom:14px"></div>

  <div class="secLab">アポ取り → 着座 → 契約（インフルエンサーDM）</div>
  <div class="grid cards3" id="funnel" style="margin-bottom:14px"></div>

  <div class="grid two" style="margin-bottom:14px">
    <div class="card">
      <div class="head"><div><p class="h">日別のDM送信数</p><span class="hsub" id="flowsub">今月</span></div></div>
      <div id="flow"></div>
    </div>
    <div class="card">
      <div class="head"><div><p class="h">DM数の多いアカウント</p><span class="hsub">今月の累計</span></div></div>
      <div id="top"></div>
    </div>
  </div>

  <div class="card">
    <div class="head"><div><p class="h">アカウント別の稼働</p><span class="hsub">見出しをタップで並べ替え</span></div></div>
    <div id="table"></div>
  </div>
</div>

<script>
const PEOPLE = {
  all:      {name:"全体"},
  ikeda:    {name:"池田"},
  tanimura: {name:"谷村"},
};
let CUR = "all";
let DATA = null;
let sortKey = "dm", sortDesc = true;

const $ = s => document.querySelector(s);
const fmt = n => (n == null ? "—" : Number(n).toLocaleString());
const esc = s => (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const lsGet = (k,d) => {try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}};
const lsSet = (k,v) => localStorage.setItem(k, JSON.stringify(v));

// 「全体」は2人ぶんを足して1つの人として扱う
function personData(key){
  if (!DATA || !DATA.people) return null;
  if (key !== "all") return DATA.people[key] || null;

  const daily = {}, accounts = {};
  Object.values(DATA.people).forEach(p => {
    (p.daily || []).forEach(d => {
      const t = daily[d.day] = daily[d.day] || {day:d.day, dm:0, list:0, reply:0, appt:0};
      t.dm += d.dm||0; t.list += d.list||0; t.reply += d.reply||0; t.appt += d.appt||0;
    });
    (p.accounts || []).forEach(a => {
      const t = accounts[a.account] = accounts[a.account] || {account:a.account, genre:a.genre, dm:0, list:0, reply:0, appt:0};
      t.dm += a.dm||0; t.list += a.list||0; t.reply += a.reply||0; t.appt += a.appt||0;
    });
  });
  // アポ取り・着座・契約も2人ぶんを足す。ここを足し忘れると全体だけ0になる。
  const funnel = {appt:0, sat:0, contract:0};
  Object.values(DATA.people).forEach(p => {
    const f = p.funnel || {};
    funnel.appt += f.appt||0; funnel.sat += f.sat||0; funnel.contract += f.contract||0;
  });
  return {
    name: "全体",
    daily: Object.values(daily).sort((x,y)=>x.day-y.day),
    accounts: Object.values(accounts),
    funnel: funnel,
  };
}

function buildTabs(){
  const t = $("#tabs"); t.innerHTML = "";
  Object.keys(PEOPLE).forEach(k => {
    const b = document.createElement("button");
    b.className = "tab" + (k === CUR ? " on" : "");
    b.textContent = PEOPLE[k].name;
    b.onclick = () => { CUR = k; buildTabs(); render(); };
    t.appendChild(b);
  });
}

function statCard(lab, val, unit, badge){
  const b = badge ? `<span class="badge ${badge.cls}">${badge.txt}</span>` : "";
  return `<div class="card stat"><div class="lab">${lab}</div>
    <div class="val">${val}${unit ? `<small> ${unit}</small>` : ""}</div>${b}</div>`;
}

function render(){
  const p = personData(CUR);
  $("#hello").textContent = (PEOPLE[CUR] ? PEOPLE[CUR].name : "") + "の稼働量";

  if (!p) {
    $("#sub").textContent = "データがまだありません";
    $("#stats").innerHTML = ""; $("#flow").innerHTML = `<div class="empty">データがまだありません</div>`;
    $("#top").innerHTML = ""; $("#table").innerHTML = "";
    return;
  }

  const month = DATA.month || "";
  $("#sub").innerHTML = `${month} ・ 更新 ${DATA.generated_at || "—"}`;

  const daily = p.daily || [];
  const acc = p.accounts || [];
  const sum = k => daily.reduce((s,d) => s + (d[k]||0), 0);

  // 今日＝データがある最後の日
  const worked = daily.filter(d => (d.dm||0) > 0);
  const last = worked.length ? worked[worked.length-1] : null;
  const prev = worked.length > 1 ? worked[worked.length-2] : null;

  const dmToday = last ? last.dm : 0;
  let badge = {cls:"flat", txt:"前日比 —"};
  if (last && prev && prev.dm) {
    const diff = last.dm - prev.dm;
    const pct = Math.round(diff / prev.dm * 100);
    badge = diff >= 0 ? {cls:"up", txt:`↑ +${pct}% 前日比`} : {cls:"down", txt:`↓ ${pct}% 前日比`};
  }

  const totalDm = sum("dm"), totalReply = sum("reply"), totalAppt = sum("appt");
  const rate = totalDm ? (totalReply / totalDm * 100).toFixed(1) : "0.0";
  const avg = worked.length ? Math.round(totalDm / worked.length) : 0;

  // アポ取り・着座・契約は営業シートの「インフルエンサーDM」から。
  // DM管理シートのG列（アポ取り数）は手入力のまま埋まっていないので使わない。
  const f = p.funnel || {appt:0, sat:0, contract:0};
  const pct = (a, b) => b ? (a / b * 100).toFixed(1) + "%" : "—";

  $("#stats").innerHTML =
    statCard("直近の日のDM数", fmt(dmToday), last ? `（${last.day}日）` : "", badge) +
    statCard("今月の累計DM数", fmt(totalDm), "件", {cls:"flat", txt:`稼働${worked.length}日 ・ 1日平均${fmt(avg)}件`}) +
    statCard("返信数", fmt(totalReply), "件", {cls:"flat", txt:`返信率 ${rate}%`}) +
    statCard("アポ取り", fmt(f.appt), "件", {cls:"flat", txt: totalDm ? `DMの${pct(f.appt, totalDm)}` : "営業シート"});

  $("#funnel").innerHTML =
    statCard("アポ取り", fmt(f.appt), "件", {cls:"flat", txt:"面談が入った数"}) +
    statCard("着座", fmt(f.sat), "件", {cls:"flat", txt:`アポの${pct(f.sat, f.appt)}`}) +
    statCard("契約", fmt(f.contract), "件", {cls:"flat", txt:`着座の${pct(f.contract, f.sat)}`});

  // 日別の棒グラフ（1〜31日）
  const maxDm = Math.max(1, ...daily.map(d => d.dm||0));
  $("#flow").innerHTML = daily.some(d => (d.dm||0) > 0)
    ? `<div style="display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:8px">` +
      daily.map(d => {
        const h = Math.max(2, Math.round((d.dm||0) / maxDm * 150));
        const on = (d.dm||0) > 0;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px" title="${d.day}日 ${fmt(d.dm)}件">
          <div style="font-size:9px;color:var(--ink3);font-weight:600">${on ? fmt(d.dm) : ""}</div>
          <div style="width:70%;height:${h}px;border-radius:6px 6px 3px 3px;background:${on ? "linear-gradient(var(--accent),var(--accent-2))" : "var(--line)"}"></div>
          <div style="font-size:9px;color:var(--ink3)">${d.day}</div>
        </div>`;
      }).join("") + `</div>`
    : `<div class="empty">まだDMの記録がありません</div>`;

  // DM数の多いアカウント上位5
  const top = [...acc].sort((a,b) => (b.dm||0) - (a.dm||0)).slice(0,5);
  $("#top").innerHTML = top.length && top[0].dm
    ? top.map((a,i) => `<div class="win"><div class="rank">${i+1}</div>
        <div class="n">${esc(a.account)}<div style="font-size:11px;color:var(--ink3);font-weight:400">${esc(a.genre||"")}</div></div>
        <div class="m">${fmt(a.dm)}件</div></div>`).join("")
    : `<div class="empty">まだ記録がありません</div>`;

  // アカウント別テーブル
  const rows = [...acc].sort((a,b) => {
    const x = a[sortKey], y = b[sortKey];
    if (typeof x === "string") return sortDesc ? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y));
    return sortDesc ? (y||0)-(x||0) : (x||0)-(y||0);
  });
  const th = (k, label, num) => `<th class="${num?"num":""}" data-k="${k}">${label}${sortKey===k?(sortDesc?" ↓":" ↑"):""}</th>`;
  $("#table").innerHTML = rows.length
    ? `<table class="tbl"><thead><tr>
        ${th("account","アカウント")}${th("genre","ジャンル")}
        ${th("dm","DM数",1)}${th("list","リスト",1)}${th("reply","返信",1)}${th("appt","アポ",1)}
        <th class="num">返信率</th></tr></thead><tbody>` +
      rows.map(a => {
        const r = a.dm ? (a.reply/a.dm*100).toFixed(1) : "0.0";
        return `<tr><td>${esc(a.account)}</td><td><span class="pill">${esc(a.genre||"—")}</span></td>
          <td class="num" style="font-weight:600">${fmt(a.dm)}</td><td class="num">${fmt(a.list)}</td>
          <td class="num">${fmt(a.reply)}</td><td class="num">${fmt(a.appt)}</td><td class="num">${r}%</td></tr>`;
      }).join("") + `</tbody></table>`
    : `<div class="empty">アカウントがありません</div>`;
}

$("#table").addEventListener("click", e => {
  const th = e.target.closest("th[data-k]");
  if (!th) return;
  const k = th.dataset.k;
  if (k === sortKey) sortDesc = !sortDesc; else { sortKey = k; sortDesc = true; }
  render();
});

async function load(){
  try{
    const r = await fetch("dm_data.json?t=" + Date.now(), {cache:"no-store"});
    if (r.ok) DATA = await r.json();
  }catch(e){}
  render();
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = t === "dark" ? "☀" : "☾";
  lsSet("dm_theme", t);
}
applyTheme(lsGet("dm_theme","light"));
$("#theme").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
$("#refresh").onclick = async () => {
  const b = $("#refresh"); b.disabled = true;
  $("#sub").textContent = "最新データを取得中…";
  try { await load(); } finally { b.disabled = false; }
};

buildTabs(); render(); load();
</script>
</body>
</html>
