<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads運用ダッシュボード</title>
<style>
:root{
  --accent:#7b61ff; --accent-soft:#efeaff; --accent-2:#b8abff;
  --bg:#f4f3fa; --card:#ffffff; --ink:#1c1b29; --ink2:#6b6980; --ink3:#9d9bb0;
  --line:#eceaf4; --good:#16a06a; --good-bg:#e6f6ef; --bad:#e2544f; --bad-bg:#fdecec;
  --radius:16px; --shadow:0 1px 3px rgba(30,25,60,.05);
}
:root[data-theme=dark]{
  --accent:#8f7bff; --accent-soft:#2a2547; --accent-2:#5b4fa8;
  --bg:#141320; --card:#1e1c2e; --ink:#f0eefb; --ink2:#a6a3c0; --ink3:#75729a;
  --line:#2b2940; --good:#4cd196; --good-bg:#173a2c; --bad:#f0817d; --bad-bg:#3a1f1f;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;padding:18px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:14px;padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.tools{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:var(--card);color:var(--ink2);cursor:pointer;font-size:16px;box-shadow:var(--shadow)}
.hello{font-size:22px;font-weight:700;margin:2px 0 2px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.cards4{grid-template-columns:repeat(4,1fr)}
.cards3{grid-template-columns:repeat(3,1fr)}
.two{grid-template-columns:1.6fr 1fr}
.two2{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.stat .lab{color:var(--ink2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.stat .val{font-size:26px;font-weight:800;margin:8px 0 8px;letter-spacing:-.5px}
.stat .val small{font-size:14px;color:var(--ink3);font-weight:600}
.substat{display:flex;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.substat>div{flex:1;text-align:center;border-right:1px solid var(--line)}
.substat>div:last-child{border-right:0}
.substat .sn{font-size:17px;font-weight:800;line-height:1.3}
.substat .st{font-size:10px;color:var(--ink3);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge.up{color:var(--good);background:var(--good-bg)}
.badge.down{color:var(--bad);background:var(--bad-bg)}
.badge.flat{color:var(--ink2);background:var(--line)}
.arrow{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
.h{font-size:16px;font-weight:700;margin:0 0 2px}
.hsub{color:var(--ink3);font-size:12px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend .row{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--ink3);font-weight:600;font-size:11px;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line);color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.goal{margin-bottom:14px}
.goalrow{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.goalrow .goal{margin-bottom:0}
.goalrow .gt{flex-direction:column;gap:2px;align-items:flex-start}
.goalrow .gt span{font-size:12px;color:var(--ink2)}
.goalrow .gt b{font-size:15px}
@media(max-width:820px){.goalrow{grid-template-columns:1fr 1fr}}
.goal .gt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.goal .gt b{font-weight:700}
.bar{height:9px;border-radius:20px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.bar > i.ok{background:var(--good)}
.goalmini{margin-top:10px;display:flex;gap:7px;align-items:baseline;font-size:11px;color:var(--ink3);font-weight:600}
.goalmini b{font-size:13px;font-weight:800;color:var(--ink2)}
.goalmini b.ok{color:var(--good)}
.win{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.win:last-child{border-bottom:0}
.rank{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}
.win .n{font-weight:600;font-size:14px;flex:1}
.win .m{color:var(--ink3);font-size:12px}
.fab{position:sticky;bottom:14px;margin-top:16px;display:flex;justify-content:center}
.fab button{border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:14px 26px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(123,97,255,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,15,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 20px 26px}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .note{color:var(--ink3);font-size:12px;margin-bottom:16px}
.field{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.field label{width:110px;font-size:14px;font-weight:600}
.field input{flex:1;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:0 14px;font-size:16px;text-align:right}
.field .prev{width:70px;color:var(--ink3);font-size:12px}
.sheet .save{width:100%;height:48px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border-radius:12px;cursor:pointer;margin-top:6px}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:26px 0}
.arrow{cursor:pointer;border:0;font-family:inherit}
.ptabs{display:flex;gap:4px;margin:8px 0 2px}
.ptab{border:0;background:var(--line);color:var(--ink2);font-size:11px;font-weight:700;padding:3px 11px;border-radius:8px;cursor:pointer;font-family:inherit}
.ptab.on{background:var(--accent);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,40,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:100%;max-width:540px;max-height:82vh;overflow:auto;border-radius:18px;padding:20px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.modal .mh h3{margin:0;font-size:17px}
.modal .close{border:0;background:var(--line);color:var(--ink);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px}
.modal .msub{color:var(--ink3);font-size:12px;margin-bottom:14px}
.gedit{border:0;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .7s linear infinite}
@media(max-width:820px){.cards4,.cards3{grid-template-columns:1fr 1fr}.two,.two2{grid-template-columns:1fr}}
@media(max-width:480px){.cards4,.cards3{grid-template-columns:1fr 1fr}.hello{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">T</div>Threads運用</div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <button class="iconbtn" id="refresh" title="更新">⟳</button>
      <button class="iconbtn" id="theme" title="テーマ">☾</button>
    </div>
  </div>

  <div class="hello" id="hello">おかえりなさい</div>
  <div class="sub" id="sub">読み込み中…</div>

  <div class="grid cards3" id="stats" style="margin-bottom:14px"></div>

  <div class="card" style="margin-bottom:14px">
    <div class="head"><div><p class="h">今月の目標</p><span class="hsub">進捗</span></div><button class="gedit" id="editGoals">編集</button></div>
    <div id="goals" class="goalrow"></div>
  </div>

  <div class="grid two" style="margin-bottom:14px">
    <div class="card">
      <div class="head"><div><p class="h">インプレッション推移</p><span class="hsub" id="flowsub">直近の投稿</span></div></div>
      <div id="flow"></div>
    </div>
    <div class="card">
      <div class="head"><div><p class="h">今週の勝ち型</p><span class="hsub" id="winsub">型別の平均インプレ</span></div></div>
      <div id="wins"></div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:1fr">
    <div class="card">
      <div class="head"><div><p class="h">最近の投稿</p><span class="hsub">タップで数字を確認</span></div></div>
      <div id="recent"></div>
    </div>
  </div>

  <div class="fab"><button id="openInput">＋ 今日の数値を入力</button></div>
</div>

<div class="modal-bg" id="detailbg"><div class="modal">
  <div class="mh"><h3 id="dtitle">詳細</h3><button class="close" id="dclose" aria-label="閉じる">×</button></div>
  <div class="msub" id="dsub"></div>
  <div id="dbody"></div>
</div></div>

<div class="sheet-bg" id="sheetbg">
  <div class="sheet">
    <h3>今日の数値を入力</h3>
    <p class="note" id="sheetacct">この端末に保存されます</p>
    <div class="field"><label>アポ / 相談</label><input id="in_appt" inputmode="numeric" placeholder="0"><span class="prev" id="prev_appt"></span></div>
    <div class="field"><label>プロフィール閲覧（合計）</label><input id="in_profile" inputmode="numeric" placeholder="0"><span class="prev" id="prev_profile"></span></div>
    <div class="field"><label>公式LINE追加</label><input id="in_line" inputmode="numeric" placeholder="0"><span class="prev" id="prev_line"></span></div>
    <button class="save" id="saveInput">保存（今日の日付）</button>
    <button id="clearInput" style="width:100%;background:none;border:0;color:var(--bad);font-size:13px;margin-top:14px;cursor:pointer;font-family:inherit">この端末で入れた数値を全部消す</button>
  </div>
</div>

<script>
const ACCOUNTS = {
  A: {name:"クラウドワークス裏側", handle:"@cw_uragawa", kpi2:"無料相談", url:"kpi_data_A.json"},
  B: {name:"駆け込み寺", handle:"@kakekomi_tera_", kpi2:"無料相談", url:"kpi_data_B.json"},
};
const GOAL_DEFAULT = {follower:150, posts:5, chat:100, appt:10, impMonth:0, impAvg:0, line:0};
// 月次コミット（アカウントごとの目標。端末で編集すると上書きされる）
const GOAL_BY_ACCT = {
  A: {follower:150, posts:5, chat:600, appt:15, impMonth:300000, impAvg:2000, line:30},
};
const FUNNEL = {};   // funnel_<acct>.json（noteクリック等の自動取得分）
const DEMO = {};     // 同ファイルの demographics（フォロワーの年齢・性別・国）
const HOOK_TYPES = [
  {key:"権威開示", re:/(していたから|見てきた|担当をして|やってわかった|年やって|件見て)/},
  {key:"数字対比", re:/(\d+件|\d+\s*人|\d+%|\d+件中|100件|300件)/},
  {key:"未回収",   re:/(共通点|理由は|一番|ワースト|ランキング|だけです|逆です|、$)/},
  {key:"タイプ分類",re:/(タイプ|型|パターン|種類)/},
];
let CUR = "A";
let DATA = {};

const SAMPLE = { // 実データが空のときのデモ表示（本番でデータが入ると自動で消える）
  demo:true,
  generated_at:"サンプル",
  posts:[
    {date:"2026-07-17",hour:12,imp:412,likes:9,comments:2,content:"採用担当をしていたから言います。100件で読んだのは13件"},
    {date:"2026-07-18",hour:21,imp:880,likes:21,comments:5,content:"発注側が二度と依頼しない受注者の4タイプ"},
    {date:"2026-07-19",hour:20,imp:1204,likes:43,comments:8,content:"提案文300件見てきた発注側が言う落ちる共通点"},
    {date:"2026-07-20",hour:19,imp:660,likes:14,comments:3,content:"金額は相談で応募するな。後回しにされる理由"},
    {date:"2026-07-21",hour:21,imp:1530,likes:58,comments:12,content:"0円で途中終了を持ちかけられたときの一言"},
    {date:"2026-07-22",hour:12,imp:742,likes:19,comments:4,content:"単価が安い案件ほど発注側はヤバい人が多い"},
    {date:"2026-07-23",hour:12,imp:980,likes:27,comments:6,content:"リピートを決める瞬間は3つあります",text:"発注側がリピートを決める瞬間は3つあります。\n\n1つ目は納品が早いこと。2つ目は連絡が短くて分かりやすいこと。そして一番デカいのが、納品のときに次の提案が1行添えてあることです。\n\n「ここも直すともっと良くなります」の一言で、次を探す手間が消える。発注側はいつも、考えなくていい相手を探してます。"},
    {date:"2026-07-23",hour:20,imp:1120,likes:34,comments:7,content:"提案文300件で返信したのは9件だけ",text:"発注する側として300件の提案文を見てきました。返信したのは、たった9件です。\n\n差はスキルじゃない。291件は「私は〇〇ができます」で始まってた。返信した9件は全部「募集文のここを読みました」から始まってた。\n\n発注側は自分の話を聞いてほしいんじゃない。自分の悩みを分かってる人を探してる。"},
  ],
  followers:[
    {date:"2026-07-19",count:96},{date:"2026-07-20",count:104},{date:"2026-07-21",count:113},
    {date:"2026-07-22",count:122},{date:"2026-07-23",count:128},
  ],
};

const $ = s => document.querySelector(s);
const fmt = n => (n==null?"—":Number(n).toLocaleString());
const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let VIEWPOSTS=[];
let MANUAL={};
const today = () => new Date().toISOString().slice(0,10);
const lsGet = (k,d) => {try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lsSet = (k,v) => localStorage.setItem(k,JSON.stringify(v));

let impPeriod = "week";
let fnPeriod  = "day";   // ファネル4枚の期間（日／月）
const avg = a => a.length? Math.round(a.reduce((s,v)=>s+v,0)/a.length):0;
function daysAgo(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function between(p,fromAgo,toAgo){const dt=(p.date||"");return dt>=daysAgo(fromAgo)&&dt<=daysAgo(toAgo);}
function periodStats(posts){
  const wi=posts.filter(p=>p.imp!=null);
  const byDate={}; wi.forEach(p=>{(byDate[p.date]=byDate[p.date]||[]).push(p.imp);});
  const dts=Object.keys(byDate).sort(); const ld=dts[dts.length-1], pd=dts[dts.length-2];
  return {
    day:  {avg:ld?avg(byDate[ld]):0, prev:pd?avg(byDate[pd]):0, n:ld?byDate[ld].length:0, unit:"前日比"},
    week: {avg:avg(wi.filter(p=>between(p,6,0)).map(p=>p.imp)),  prev:avg(wi.filter(p=>between(p,13,7)).map(p=>p.imp)),  n:wi.filter(p=>between(p,6,0)).length,  unit:"前週比"},
    month:{avg:avg(wi.filter(p=>between(p,29,0)).map(p=>p.imp)), prev:avg(wi.filter(p=>between(p,59,30)).map(p=>p.imp)), n:wi.filter(p=>between(p,29,0)).length, unit:"前月比"},
  };
}
function buildBars(posts, period){
  const wi=posts.filter(p=>p.imp!=null);
  if(period==="day") return posts.slice(-8).map(p=>({label:(p.date||"").slice(5), val:p.imp||0}));
  const out=[];
  if(period==="week"){ for(let i=6;i>=0;i--){const day=daysAgo(i);out.push({label:day.slice(5),val:avg(wi.filter(p=>p.date===day).map(p=>p.imp))});} return out; }
  for(let w=5;w>=0;w--){const from=daysAgo(w*7+6),to=daysAgo(w*7);out.push({label:from.slice(5),val:avg(wi.filter(p=>(p.date||"")>=from&&(p.date||"")<=to).map(p=>p.imp))});}
  return out;
}

function classifyHook(text){
  for(const h of HOOK_TYPES){ if(h.re.test(text||"")) return h.key; }
  return "その他";
}

function buildTabs(){
  const t = $("#tabs"); t.innerHTML="";
  Object.keys(ACCOUNTS).forEach(k=>{
    const b=document.createElement("button");
    b.className="tab"+(k===CUR?" on":""); b.textContent=k+"："+ACCOUNTS[k].name;
    b.onclick=()=>{CUR=k;buildTabs();render();};
    t.appendChild(b);
  });
}

function manualEntries(acct){
  const pub=MANUAL[acct]||[]; const loc=lsGet("uni_kpi_"+acct+"_manual", []);
  const byDate={};
  loc.forEach(e=>{byDate[e.date]=e;});
  pub.forEach(e=>{byDate[e.date]=e;});
  return Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
}
function goals(acct){ return Object.assign({}, GOAL_DEFAULT, GOAL_BY_ACCT[acct]||{}, lsGet("uni_kpi_"+acct+"_goals_v2", {})); }

function statCard(lab,val,unit,badge,key,extra,sub,goal){
  const b = badge ? `<span class="badge ${badge.cls}">${badge.txt}</span>` : "";
  // sub は [[数値,見出し],…]。ファネルの内訳をカード下段に小さく並べるのに使う。
  const sb = (sub&&sub.length) ? `<div class="substat">`+
    sub.map(([n,t])=>`<div><div class="sn">${n}</div><div class="st">${t}</div></div>`).join("")+`</div>` : "";
  // goal は {cur,target,unit,note}。目標に対する位置を「◯ / ◯」で1行だけ出す。
  let gb = "";
  if(goal && goal.target>0){
    const done = goal.cur>=goal.target;
    gb = `<div class="goalmini"><span>${goal.note||"目標"}</span>
      <b class="${done?'ok':''}">${fmt(goal.cur)} / ${fmt(goal.target)}${goal.unit||""}</b></div>`;
  }
  return `<div class="card stat"><div class="lab">${lab}<button class="arrow" data-detail="${key||''}" title="詳細を見る">↗</button></div>
    ${extra||""}<div class="val">${val}${unit?`<small> ${unit}</small>`:""}</div>${b}${gb}${sb}</div>`;
}

function render(){
  const a = ACCOUNTS[CUR];
  const d = DATA[CUR] || SAMPLE;
  const posts = (d.posts||[]).slice().sort((x,y)=>(x.date>y.date?1:-1));
  VIEWPOSTS = posts;
  const isDemo = d===SAMPLE || d.demo;
  $("#hello").textContent = "おかえりなさい、"+a.name;
  $("#sub").innerHTML = a.handle+" ・ 更新 "+(d.generated_at||"—")+(isDemo?' ・ <b style="color:var(--accent)">サンプル表示（データ接続待ち）</b>':"");
  $("#sheetacct").textContent = a.name+"｜この端末に保存されます";

  // stats
  const tkey=today();
  const todayPosts = posts.filter(p=>(p.date||"").slice(0,10)===tkey).length;
  const g = goals(CUR);
  const PS = periodStats(posts);
  const ps = PS[impPeriod];
  const impBadge = ps.prev? (ps.avg>=ps.prev?{cls:"up",txt:"↑ "+Math.round((ps.avg-ps.prev)/ps.prev*100)+"% "+ps.unit}:{cls:"down",txt:"↓ "+Math.round((ps.prev-ps.avg)/ps.prev*100)+"% "+ps.unit}) : {cls:"flat",txt:"データ蓄積中"};
  const ptabs = `<div class="ptabs">`+[["day","日"],["week","週"],["month","月"]].map(([k,l])=>`<button class="ptab ${k===impPeriod?'on':''}" data-per="${k}">${l}</button>`).join("")+`</div>`;
  const fol = d.followers||[];
  const folNow = fol.length?fol[fol.length-1].count:null;
  const folPrev = fol.length>1?fol[fol.length-2].count:null;
  const folBadge = (folNow!=null&&folPrev!=null)? (folNow>=folPrev?{cls:"up",txt:"↑ +"+(folNow-folPrev)+" 前日"}:{cls:"down",txt:"↓ "+(folNow-folPrev)+" 前日"}):{cls:"flat",txt:"—"};
  const man = manualEntries(CUR);
  const lastChat = [...man].reverse().find(e=>e.chat!=null);
  const chatVal = lastChat?lastChat.chat:null;
  const lastProf = [...man].reverse().find(e=>e.profile!=null);
  const manProf = lastProf?lastProf.profile:null;
  const fn = FUNNEL[CUR]||[];

  // ファネル4枚（プロフィール／noteクリック／note閲覧／公式LINE）の日・月切り替え。
  // 数え方が2種類ある。プロフィールとクリックはその日に起きた数なので月は合計。
  // noteの閲覧数と公式LINEの友だち数は積み上がった総数なので、月は増えた分を出す。
  const fnYM = (fn.length? fn[fn.length-1].date : today()).slice(0,7);
  const fnMon = fn.filter(r=>(r.date||"").slice(0,7)===fnYM);
  const rowsWith = (rows,k)=>rows.filter(r=>r[k]!=null);
  const lastVal  = (rows,k)=>{const v=rowsWith(rows,k); return v.length? v[v.length-1][k] : null;};
  const prevVal  = (rows,k)=>{const v=rowsWith(rows,k); return v.length>1? v[v.length-2][k] : null;};
  const lastDate = (rows,k)=>{const v=rowsWith(rows,k); return v.length? v[v.length-1].date : null;};
  const sumVal   = (rows,k)=>{const v=rowsWith(rows,k); return v.length? v.reduce((a,r)=>a+r[k],0) : null;};
  const growVal  = (rows,k)=>{const v=rowsWith(rows,k); return v.length>1? v[v.length-1][k]-v[0][k] : null;};
  const isMon = fnPeriod==="month";
  const isAll = fnPeriod==="all";
  const monLabel = fnYM.slice(5)+"月";
  // 集計の対象。日と月は最新／今月、全体は記録が残っている全期間。
  const fnScope = isMon ? fnMon : fn;
  const scopeLabel = isAll ? "全期間" : monLabel;

  const ftabs = `<div class="ptabs">`+[["day","日"],["month","月"],["all","全体"]]
    .map(([k,l])=>`<button class="ptab ${k===fnPeriod?'on':''}" data-fper="${k}">${l}</button>`).join("")+`</div>`;

  // 日ごとに起きた数（合計してよいもの）
  function flowCard(k){
    if(isMon||isAll){
      const rows = isMon?fnMon:fn;
      return {val:sumVal(rows,k), badge:{cls:"flat", txt:scopeLabel+"の合計 ・ "+rowsWith(rows,k).length+"日分"}};
    }
    const now=lastVal(fn,k), pv=prevVal(fn,k), dt=lastDate(fn,k);
    if(now==null) return {val:null, badge:{cls:"flat", txt:"未取得"}};
    if(pv==null)  return {val:now,  badge:{cls:"flat", txt:(dt||"")+" の分"}};
    return {val:now, badge: now>=pv
      ? {cls:"up",  txt:"↑ +"+(now-pv)+" 前回 ・ "+(dt||"").slice(5)}
      : {cls:"down",txt:"↓ "+(now-pv)+" 前回 ・ "+(dt||"").slice(5)}};
  }
  // 積み上がった総数の出し方は指標で分ける。
  //   grow  … noteの閲覧数。「どれだけ読まれたか」なので増えた分を主役にし、累計はバッジへ。
  //   total … 公式LINEの友だち数。「いま何人か」が主なので総数を出し、増減はバッジへ。
  function stockCard(k, mode){
    const tot = lastVal(fn,k), dt = lastDate(fn,k);
    if(tot==null) return {val:null, badge:{cls:"flat", txt:"未取得"}};
    const grow = isMon ? growVal(fnMon,k)
               : isAll ? null
               : (prevVal(fn,k)==null ? null : tot-prevVal(fn,k));
    const when = isMon ? monLabel+"で" : "前回から";
    if(mode==="total"){
      const t = isAll ? "これまでの合計"
              : grow==null ? (dt||"")+" 時点"
              : grow>0 ? when+"+"+grow : grow<0 ? when+grow : when+"動きなし";
      return {val:tot, badge:{cls: grow>0?"up":grow<0?"down":"flat", txt:t}};
    }
    if(isAll) return {val:tot, badge:{cls:"flat", txt:"これまでの合計"}};
    if(grow==null) return {val:tot, badge:{cls:"flat", txt:(dt||"")+" 時点"}};
    return {val:grow, badge:{cls: grow>0?"up":"flat",
            txt: when+"増えた分 ・ 累計"+fmt(tot)+"回"}};
  }

  const cPv   = stockCard("note_pv","grow");
  const cLine = stockCard("line_followers","total");
  // いいねとフォロワーは積み上がった総数。期間で切らずに、いまの合計をそのまま出す。
  const nFolNow = lastVal(fn,"note_followers");
  const nLikeNow = lastVal(fn,"note_likes");
  const cLnk  = flowCard("line_clicks");

  // プロフィール → note は同じ行どうしで数える。プロフィールは投稿日にしか
  // 記録が無いので、noteクリックもその日の値を使わないと率がずれる。
  const profRows = rowsWith(isMon?fnMon:fn, "profile_views");
  const profSrc  = (isMon||isAll) ? profRows : profRows.slice(-1);
  const pfProf   = profSrc.length? profSrc.reduce((a,r)=>a+r.profile_views,0) : null;
  const pfClicks = profSrc.length? profSrc.reduce((a,r)=>a+(r.note_clicks||0),0) : null;
  const pfViews  = profSrc.length? profSrc.reduce((a,r)=>a+(r.views||0),0) : null;
  const pfPrev   = (!isMon && !isAll && profRows.length>1)? profRows[profRows.length-2].profile_views : null;
  const pfDate   = profSrc.length? profSrc[profSrc.length-1].date : null;
  const pfBadge  = pfProf==null ? {cls:"flat", txt:"未取得"}
    : (isMon||isAll) ? {cls:"flat", txt:scopeLabel+"の合計 ・ "+profSrc.length+"日分 ・ 閲覧の"+(pfViews?(pfProf/pfViews*100).toFixed(1)+"%":"—")}
    : pfPrev==null ? {cls:"flat", txt:(pfDate||"")+" の投稿"}
    : {cls: pfProf>=pfPrev?"up":"down",
       txt:(pfProf>=pfPrev?"↑ +":"↓ ")+(pfProf-pfPrev)+" 前回 ・ 閲覧の"+(pfViews?(pfProf/pfViews*100).toFixed(1)+"%":"—")};
  const pfRate = (pfProf&&pfClicks!=null)? (pfClicks/pfProf*100).toFixed(1)+"%" : "—";

  // 公式LINEは note を読んだ人がどれだけ踏んだかで見る。
  const lnRate = (cPv.val&&cLnk.val!=null)? (cLnk.val/cPv.val*100).toFixed(1)+"%" : "—";
  // 公式LINEの目標は「今月に何人増やすか」なので、日表示でも今月の増加分と比べる。
  const lineGrow = growVal(fnMon,"line_followers") || 0;

  $("#stats").innerHTML =
    statCard("今日の投稿", todayPosts, "/ "+g.posts, {cls: todayPosts>=g.posts?"up":"flat", txt: (todayPosts>=g.posts?"達成":"あと"+(g.posts-todayPosts)+"件")+" ・ 累計"+fmt(posts.length)+"件"}, "posts") +
    statCard("平均インプレ", fmt(ps.avg), "", impBadge, "imp", ptabs, null,
             {cur:ps.avg, target:g.impAvg, note:"1投稿あたりの目標"}) +
    statCard("フォロワー", fmt(folNow), "人", folBadge, "follower", null, null,
) +
    statCard("プロフィール → note", fmt(pfProf), "人 プロフィール", pfBadge, "profile", ftabs,
             [[fmt(pfClicks),"noteクリック"],[pfRate,"プロフィールから"]]) +
    statCard("note", fmt(cPv.val), "回 閲覧", cPv.badge, "notepv", ftabs,
             [[fmt(nLikeNow),"いいね"],[fmt(nFolNow),"フォロワー"]]) +
    statCard("公式LINE", fmt(cLine.val), "人", cLine.badge, "line", ftabs,
             [[fmt(cLnk.val),"LINEクリック"],[lnRate,"note閲覧から"]],
             {cur:lineGrow, target:g.line, unit:"人", note:"今月の追加"});

  // flow bars（期間連動：日=投稿ごと / 週=日別平均 / 月=週別平均）
  const bars = buildBars(posts, impPeriod);
  const maxImp = Math.max(1,...bars.map(b=>b.val));
  $("#flowsub").textContent = ({day:"投稿ごとのインプレ",week:"日別の平均インプレ",month:"週別の平均インプレ"})[impPeriod];
  $("#flow").innerHTML = bars.some(b=>b.val>0)? `<div style="display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:8px">`+
    bars.map(b=>{
      const h=Math.max(4,Math.round((b.val)/maxImp*150));
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="font-size:11px;color:var(--ink3);font-weight:600">${b.val?fmt(b.val):""}</div>
        <div style="width:60%;height:${h}px;background:linear-gradient(var(--accent),var(--accent-2));border-radius:8px 8px 4px 4px"></div>
        <div style="font-size:10px;color:var(--ink3)">${b.label}</div>
      </div>`;
    }).join("")+`</div>` : `<div class="empty">投稿データがまだありません</div>`;

  // wins (hook types)
  const byType={};
  posts.filter(p=>p.imp!=null).forEach(p=>{const k=classifyHook(p.content);(byType[k]=byType[k]||[]).push(p.imp);});
  const winsArr=Object.entries(byType).map(([k,v])=>({k,avg:Math.round(v.reduce((s,x)=>s+x,0)/v.length),n:v.length}))
    .sort((x,y)=>y.avg-x.avg).slice(0,3);
  const totalN=posts.filter(p=>p.imp!=null).length;
  const tag = totalN<5?'<span class="pill" style="background:var(--line);color:var(--ink2)">暫定・データ少</span>':"";
  $("#winsub").innerHTML = "型別の平均インプレ "+tag;
  $("#wins").innerHTML = winsArr.length? winsArr.map((w,i)=>
    `<div class="win" data-type="${w.k}" style="cursor:pointer"><div class="rank">${i+1}</div><div class="n">${w.k}</div><div class="m">平均 ${fmt(w.avg)}｜${w.n}投稿 ›</div></div>`
  ).join("")+`<div style="font-size:11px;color:var(--ink3);margin-top:8px">型をタップで投稿一覧</div>` : `<div class="empty">分析するには投稿を増やしてください</div>`;

  // recent table（1投稿ごと・時刻と本文つき）
  const hhmm = p => (p.date||"").slice(5) + (p.hour!=null?` ${String(p.hour).padStart(2,"0")}:00`:"");
  const rr = posts.map((p,i)=>({p,i})).slice(-8).reverse();
  $("#recent").innerHTML = posts.length? `<table class="tbl"><thead><tr><th>日時</th><th>内容</th><th style="text-align:right">インプレ</th><th style="text-align:right">いいね</th></tr></thead><tbody>`+
    rr.map(({p,i})=>`<tr data-i="${i}" style="cursor:pointer">
      <td style="white-space:nowrap;color:var(--ink2)">${hhmm(p)}</td>
      <td><div style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.content||"（内容なし）")}</div><span class="pill" style="margin-top:3px;display:inline-block">${classifyHook(p.content||p.text)}</span></td>
      <td style="text-align:right;font-weight:600">${fmt(p.imp)}</td>
      <td style="text-align:right">${fmt(p.likes)}</td></tr>`).join("")+
    `</tbody></table><div style="font-size:11px;color:var(--ink3);margin-top:8px">行をタップで全文表示</div>` : `<div class="empty">投稿がまだありません</div>`;

  // goals
  const mkey = tkey.slice(0,7);
  const apptMonth = man.filter(e=>e.date&&e.date.slice(0,7)===mkey).reduce((s,e)=>s+(Number(e.appt)||0),0);
  const mposts = posts.filter(p=>(p.date||"").slice(0,7)===mkey);
  const impMonthNow = mposts.reduce((s,p)=>s+(Number(p.imp)||0),0);
  const impAvgNow = mposts.length?Math.round(impMonthNow/mposts.length):0;
  const lastLine = [...man].reverse().find(e=>e.line!=null);
  const lineVal = lastLine?Number(lastLine.line):0;
  const goalRows=[
    {n:"月間インプレッション",c:impMonthNow,g:g.impMonth,u:""},
    {n:"1投稿あたり平均",c:impAvgNow,g:g.impAvg,u:""},
    {n:"公式LINE追加",c:lineVal,g:g.line,u:"人"},
    {n:a.kpi2,c:apptMonth,g:g.appt,u:"件"},
  ].filter(r=>r.g>0);
  $("#goals").innerHTML = goalRows.map(r=>{
    const pct=Math.min(100,Math.round((r.c/r.g)*100)||0);
    return `<div class="goal"><div class="gt"><span>${r.n}</span><b>${fmt(r.c)} / ${fmt(r.g)}${r.u}</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");

  // sheet prev values
  const lastAppt=[...man].reverse().find(e=>e.appt!=null);
  const lastProf2 = [...man].reverse().find(e=>e.profile!=null);
  $("#prev_profile").textContent = lastProf2?("前回 "+lastProf2.profile):"";
  $("#prev_appt").textContent = lastAppt?("前回 "+lastAppt.appt):"";
  $("#prev_line").textContent = lastLine?("前回 "+lastLine.line):"";
  $("#in_appt").value=""; $("#in_line").value=""; $("#in_profile").value="";
}

async function load(){
  await Promise.all(Object.keys(ACCOUNTS).map(async k=>{
    try{
      const r=await fetch(ACCOUNTS[k].url+"?t="+Date.now(),{cache:"no-store"});
      if(r.ok){const j=await r.json(); if(j&&Array.isArray(j.posts)) DATA[k]=j;} // 投稿0件の人もサンプルで埋めない
    }catch(e){}
    try{
      const rm=await fetch("kpi_manual_"+k+".json?t="+Date.now(),{cache:"no-store"});
      if(rm.ok){const jm=await rm.json(); if(Array.isArray(jm)) MANUAL[k]=jm;}
    }catch(e){}
    try{
      const rf=await fetch("funnel_"+k+".json?t="+Date.now(),{cache:"no-store"});
      if(rf.ok){const jf=await rf.json();
        if(jf&&Array.isArray(jf.history)) FUNNEL[k]=jf.history;
        if(jf&&jf.demographics) DEMO[k]=jf.demographics;}
    }catch(e){}
  }));
  render();
}

// theme
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("#theme").textContent=t==="dark"?"☀":"☾";lsSet("uni_theme",t);}
applyTheme(lsGet("uni_theme","light"));
$("#theme").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
$("#refresh").onclick=async ()=>{
  const b=$("#refresh"); b.classList.add("spinning"); b.disabled=true;
  $("#sub").textContent="最新データを取得中…";
  try{ await load(); }finally{ b.classList.remove("spinning"); b.disabled=false; }
};

// input sheet
$("#openInput").onclick=()=>$("#sheetbg").classList.add("on");
$("#sheetbg").onclick=e=>{if(e.target===$("#sheetbg"))$("#sheetbg").classList.remove("on");};
$("#in_appt").addEventListener("keydown",e=>{if(e.key==="Enter")$("#in_profile").focus();});
$("#in_profile").addEventListener("keydown",e=>{if(e.key==="Enter")$("#in_line").focus();});
$("#in_line").addEventListener("keydown",e=>{if(e.key==="Enter")$("#saveInput").click();});
$("#saveInput").onclick=()=>{
  const appt=$("#in_appt").value.trim(), line=$("#in_line").value.trim(), prof=$("#in_profile").value.trim();
  if(appt===""&&line===""&&prof==="")return $("#sheetbg").classList.remove("on");
  const man=manualEntries(CUR); const t=today();
  let row=man.find(e=>e.date===t); if(!row){row={date:t};man.push(row);}
  if(appt!=="")row.appt=Number(appt);
  if(line!=="")row.line=line.startsWith("+")?(Number(row.line||0)+Number(line.slice(1))):Number(line);
  if(prof!=="")row.profile=prof.startsWith("+")?(Number(row.profile||0)+Number(prof.slice(1))):Number(prof);
  lsSet("uni_kpi_"+CUR+"_manual",man);
  $("#sheetbg").classList.remove("on"); render();
};

// 詳細モーダル
function openDetail(key){
  const a=ACCOUNTS[CUR]; const dd=DATA[CUR]||SAMPLE;
  const posts=(dd.posts||[]).slice().sort((x,y)=>(x.date>y.date?1:-1));
  const man=manualEntries(CUR); let title="詳細", sub="", body="";
  const hhmm=p=>(p.date||"").slice(5)+(p.hour!=null?` ${String(p.hour).padStart(2,"0")}:00`:"");
  if(key==="imp"){
    const P=periodStats(posts);
    title="平均インプレッション"; sub="日・週・月の平均と全投稿の内訳";
    body=`<div style="display:flex;gap:8px;margin-bottom:16px">`+
      [["day","日"],["week","週"],["month","月"]].map(([k,l])=>`<div style="flex:1;background:var(--bg);border-radius:12px;padding:12px;text-align:center"><div style="font-size:12px;color:var(--ink2)">${l}</div><div style="font-size:20px;font-weight:800">${fmt(P[k].avg)}</div><div style="font-size:11px;color:var(--ink3)">${P[k].n}投稿</div></div>`).join("")+`</div>`;
    body+= posts.length? `<table class="tbl"><thead><tr><th>日時</th><th>内容</th><th style="text-align:right">インプレ</th></tr></thead><tbody>`+
      posts.slice(-20).reverse().map(p=>`<tr><td style="white-space:nowrap;color:var(--ink2)">${hhmm(p)}</td><td><div style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.content||""}</div></td><td style="text-align:right;font-weight:600">${fmt(p.imp)}</td></tr>`).join("")+`</tbody></table>` : `<div class="empty">投稿がまだありません</div>`;
  } else if(key==="posts"){
    const tp=posts.filter(p=>(p.date||"").slice(0,10)===today());
    title="今日の投稿"; sub=today()+" の投稿一覧";
    body= tp.length? `<table class="tbl"><thead><tr><th>時刻</th><th>内容</th><th style="text-align:right">インプレ</th><th style="text-align:right">いいね</th></tr></thead><tbody>`+
      tp.map(p=>`<tr><td>${p.hour!=null?String(p.hour).padStart(2,"0")+":00":"—"}</td><td><div style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.content||""}</div></td><td style="text-align:right">${fmt(p.imp)}</td><td style="text-align:right">${fmt(p.likes)}</td></tr>`).join("")+`</tbody></table>` : `<div class="empty">今日の投稿はまだありません</div>`;
  } else if(key==="follower"){
    const fol=(dd.followers||[]).slice().reverse();
    title="フォロワー推移"; sub="日別の人数と増減";
    body= fol.length? `<table class="tbl"><thead><tr><th>日付</th><th style="text-align:right">人数</th><th style="text-align:right">増減</th></tr></thead><tbody>`+
      fol.map((f,i)=>{const pv=fol[i+1];const df=pv?f.count-pv.count:null;const col=df>0?'var(--good)':df<0?'var(--bad)':'var(--ink3)';return `<tr><td>${f.date.slice(5)}</td><td style="text-align:right;font-weight:600">${fmt(f.count)}</td><td style="text-align:right;color:${col}">${df==null?"—":(df>0?"+"+df:df)}</td></tr>`;}).join("")+`</tbody></table>` : `<div class="empty">フォロワー履歴がまだありません</div>`;
    const dm = DEMO[CUR];
    if(dm && dm.age && Object.keys(dm.age).length){
      // フォロワーの年齢層。誰に向けて書くかの前提になるので、推移より上に置く。
      const age = dm.age, at = Object.values(age).reduce((x,y)=>x+y,0)||1;
      const keys = ["18-24","25-34","35-44","45-54","55-64","65+"].filter(k=>age[k]!=null);
      const top = keys.slice().sort((x,y)=>age[y]-age[x])[0];
      const g = dm.gender||{}, gt=(g.F||0)+(g.M||0);
      let gtxt = gt? `判明分では女性 ${g.F||0}人・男性 ${g.M||0}人`+(g.U?`（判定不能 ${g.U}人）`:"") : "";
      body = `<div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px">
        <div style="font-size:12px;color:var(--ink2);margin-bottom:10px">フォロワーの年齢層　合計 ${fmt(at)}人　${dm.updated?`（${dm.updated} 時点）`:""}</div>`+
        keys.map(k=>{
          const v=age[k], pc=v/at*100;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
            <div style="width:52px;font-size:12px;color:var(--ink2)">${k}</div>
            <div style="flex:1;background:var(--card);border-radius:6px;height:16px;overflow:hidden"><div style="width:${pc.toFixed(1)}%;height:100%;background:${k===top?"var(--brand,#7c5cff)":"var(--ink3)"};border-radius:6px"></div></div>
            <div style="width:78px;text-align:right;font-size:12px;font-weight:${k===top?"800":"500"}">${v}人 ${pc.toFixed(1)}%</div>
          </div>`;
        }).join("")+
        (gtxt?`<div style="font-size:12px;color:var(--ink2);margin-top:10px">${gtxt}</div>`:"")+
      `</div>` + body;
    }
  } else if(key==="chat"){
    title="手入力KPIの履歴"; sub=a.kpi2+"（×で削除）";
    body= man.length? `<table class="tbl"><thead><tr><th>日付</th><th style="text-align:right">${a.kpi2}</th><th></th></tr></thead><tbody>`+
      [...man].reverse().map(e=>`<tr><td>${e.date.slice(5)}</td><td style="text-align:right">${e.appt!=null?fmt(e.appt):"—"}</td><td style="text-align:right"><button data-delchat="${e.date}" title="削除" style="border:0;background:var(--bg);color:var(--bad);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:15px;font-family:inherit">×</button></td></tr>`).join("")+`</tbody></table>`
      +`<button id="clearAllChat" style="width:100%;background:none;border:0;color:var(--bad);font-size:13px;margin-top:14px;cursor:pointer;font-family:inherit">この端末の入力を全部消す</button>` : `<div class="empty">まだ入力がありません。下の「＋今日の数値を入力」から</div>`;
  } else if(key==="profile"||key==="note"||key==="notepv"||key==="line"){
    // ファネル3枚（プロフィール閲覧／noteクリック／note閲覧）は同じ履歴表を出す。
    const fh=(FUNNEL[CUR]||[]).slice().reverse();
    title=({profile:"プロフィールへのアクセス",note:"noteリンクのクリック",notepv:"noteの閲覧数",line:"公式LINEの友だち数"})[key];
    sub="Threads → note → 公式LINE の推移";
    body= fh.length? `<table class="tbl"><thead><tr><th>日付</th><th style="text-align:right">閲覧</th><th style="text-align:right">プロフ</th><th style="text-align:right">率</th><th style="text-align:right">noteクリック</th><th style="text-align:right">note閲覧</th><th style="text-align:right">noteフォロワー</th><th style="text-align:right">noteいいね</th><th style="text-align:right">LINE</th></tr></thead><tbody>`+
      fh.map(r=>{
        const rate=(r.profile_views!=null&&r.views)?(r.profile_views/r.views*100).toFixed(1)+"%":"—";
        const c=v=>v==null?"—":fmt(v);
        return `<tr><td style="white-space:nowrap">${r.date.slice(5)}</td><td style="text-align:right">${c(r.views)}</td><td style="text-align:right;font-weight:600">${c(r.profile_views)}</td><td style="text-align:right;color:var(--ink2)">${rate}</td><td style="text-align:right">${c(r.note_clicks)}</td><td style="text-align:right">${c(r.note_pv)}</td><td style="text-align:right">${c(r.note_followers)}</td><td style="text-align:right">${c(r.note_likes)}</td><td style="text-align:right">${c(r.line_followers)}</td></tr>`;
      }).join("")+`</tbody></table>`
      +`<p class="note" style="margin-top:12px">プロフィールへのアクセスはThreads APIに無いため、Web版の投稿インサイトから取った実測です。「—」はその日に取得していない項目です。</p>`
      : `<div class="empty">funnel_export.py がまだ動いていません</div>`;
  }
  $("#dtitle").textContent=title; $("#dsub").textContent=sub; $("#dbody").innerHTML=body;
  $("#detailbg").classList.add("on");
}
$("#stats").addEventListener("click",e=>{
  const arw=e.target.closest(".arrow"); if(arw){openDetail(arw.dataset.detail);return;}
  const pt=e.target.closest(".ptab"); if(pt){ if(pt.dataset.fper){fnPeriod=pt.dataset.fper;}else{impPeriod=pt.dataset.per;} render(); }
});
// 最近の投稿 → 全文
function openPost(i){
  const p=VIEWPOSTS[i]; if(!p)return;
  const hhmm=(p.date||"").slice(5)+(p.hour!=null?` ${String(p.hour).padStart(2,"0")}:00`:"");
  $("#dtitle").textContent="投稿の全文";
  $("#dsub").textContent=hhmm+" ・ 型："+classifyHook(p.content||p.text);
  $("#dbody").innerHTML=`<div style="display:flex;gap:8px;margin-bottom:14px">`+
    [["インプレ",fmt(p.imp)],["いいね",fmt(p.likes)],["コメント",fmt(p.comments)]].map(([l,v])=>`<div style="flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center"><div style="font-size:11px;color:var(--ink2)">${l}</div><div style="font-size:18px;font-weight:800">${v}</div></div>`).join("")+`</div>`+
    `<div style="white-space:pre-wrap;line-height:1.8;font-size:14px;background:var(--bg);border-radius:12px;padding:16px">${esc(p.text||p.content||"（本文なし）")}</div>`;
  $("#detailbg").classList.add("on");
}
// 勝ち型 → その型の投稿一覧
function openTypePosts(key){
  const list=VIEWPOSTS.filter(p=>classifyHook(p.content||p.text)===key);
  const a=avg(list.filter(p=>p.imp!=null).map(p=>p.imp));
  $("#dtitle").textContent="型："+key;
  $("#dsub").textContent=list.length+"投稿 ・ 平均インプレ "+fmt(a);
  $("#dbody").innerHTML= list.length? [...list].reverse().map(p=>{
    const hhmm=(p.date||"").slice(5)+(p.hour!=null?` ${String(p.hour).padStart(2,"0")}:00`:"");
    return `<div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:6px"><span>${hhmm}</span><span>インプレ ${fmt(p.imp)}・いいね ${fmt(p.likes)}</span></div>
      <div style="white-space:pre-wrap;line-height:1.6;font-size:13px">${esc(p.text||p.content||"")}</div></div>`;
  }).join("") : `<div class="empty">この型の投稿がまだありません</div>`;
  $("#detailbg").classList.add("on");
}
$("#recent").addEventListener("click",e=>{const tr=e.target.closest("tr[data-i]");if(tr)openPost(+tr.dataset.i);});
$("#wins").addEventListener("click",e=>{const w=e.target.closest(".win[data-type]");if(w)openTypePosts(w.dataset.type);});
// 今月の目標を編集
function openGoalEdit(){
  const g=goals(CUR); const a=ACCOUNTS[CUR];
  $("#dtitle").textContent="今月の目標を編集";
  $("#dsub").textContent=a.name+"｜数値を変えて保存（このアカウントに保存）";
  const row=(id,lab,val)=>`<div class="field" style="margin-bottom:12px"><label style="width:150px">${lab}</label><input id="${id}" inputmode="numeric" value="${val}"></div>`;
  $("#dbody").innerHTML=
    row("g_impMonth","月間インプレ",g.impMonth)+
    row("g_impAvg","1投稿の平均",g.impAvg)+
    row("g_posts","1日の投稿",g.posts)+
    row("g_line","公式LINE追加",g.line)+
    row("g_appt",a.kpi2,g.appt)+
    `<button id="g_save" style="width:100%;height:46px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border-radius:12px;cursor:pointer;margin-top:6px">保存</button>`;
  $("#detailbg").classList.add("on");
  $("#g_save").onclick=()=>{
    const ng=Object.assign(goals(CUR),{
      impMonth:Number($("#g_impMonth").value)||g.impMonth,
      impAvg:Number($("#g_impAvg").value)||g.impAvg,
      posts:Number($("#g_posts").value)||g.posts,
      line:Number($("#g_line").value)||g.line,
      appt:Number($("#g_appt").value)||g.appt,
    });
    lsSet("uni_kpi_"+CUR+"_goals_v2",ng);
    $("#detailbg").classList.remove("on"); render();
  };
}
$("#editGoals").onclick=openGoalEdit;
$("#clearInput").onclick=()=>{
  localStorage.removeItem("uni_kpi_"+CUR+"_manual");
  $("#in_appt").value=""; $("#in_line").value="";
  $("#sheetbg").classList.remove("on"); render();
};
$("#dbody").addEventListener("click",e=>{
  const del=e.target.closest("[data-delchat]");
  if(del){
    const loc=lsGet("uni_kpi_"+CUR+"_manual",[]).filter(x=>x.date!==del.dataset.delchat);
    lsSet("uni_kpi_"+CUR+"_manual",loc); render(); openDetail("chat"); return;
  }
  if(e.target.closest("#clearAllChat")){
    localStorage.removeItem("uni_kpi_"+CUR+"_manual"); render(); openDetail("chat");
  }
});
$("#dclose").onclick=()=>$("#detailbg").classList.remove("on");
$("#detailbg").onclick=e=>{if(e.target===$("#detailbg"))$("#detailbg").classList.remove("on");};

buildTabs(); render(); load();
</script>
</body>
</html>
