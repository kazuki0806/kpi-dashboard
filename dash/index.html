<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ダッシュボード</title>
<style>
/* 見た目はCW業務アプリに合わせている。色や角の丸みはあちらの値をそのまま使う。
   あちらを作り替えたときは、ここも同じ値に直すと揃ったままになる。 */
:root{
  color-scheme: light;
  --bg:#E9EFF8; --bg-deep:#DCE7F5;
  --surface-strong:rgba(255,255,255,.84);
  --surface-soft:rgba(239,246,255,.72);
  --border:rgba(30,64,110,.18);
  --highlight:rgba(255,255,255,.88);
  --text:#101B2D; --muted:#506078; --subtle:#68768B;
  --accent-bright:#3B82F6; --accent-cyan:#22D3EE;
  --glow:0 0 24px rgba(59,130,246,.4);
  --ease:200ms cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#05070D; --bg-deep:#0B1220;
    --surface-strong:rgba(13,22,38,.86);
    --surface-soft:rgba(255,255,255,.035);
    --border:rgba(255,255,255,.08);
    --highlight:rgba(255,255,255,.09);
    --text:#EDF5FF; --muted:#A7B6CB; --subtle:#8B9BB1;
    --accent-bright:#60A5FA;
  }
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:linear-gradient(160deg,var(--bg),var(--bg-deep));
  color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  display:flex; overflow:hidden;
}

#side{
  width:240px; flex-shrink:0; display:flex; flex-direction:column; overflow-y:auto;
  background:var(--surface-strong); border-right:1px solid var(--border);
  box-shadow:18px 0 50px rgba(0,0,0,.12);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
}
.brand{
  height:68px; flex-shrink:0; display:flex; align-items:center; gap:11px;
  padding:0 17px; font-size:16px; font-weight:700; letter-spacing:-.015em;
}
.brandMark{
  width:24px; height:24px; flex-shrink:0;
  border:1px solid rgba(255,255,255,.34); border-radius:8px;
  background:linear-gradient(135deg,var(--accent-bright),var(--accent-cyan));
  box-shadow:var(--glow); transform:rotate(45deg);
}
nav{padding:0 10px 18px}
.navSec{
  margin:18px 0 6px 10px; font-size:11px; font-weight:700;
  letter-spacing:.04em; color:var(--subtle);
}
.nav{
  position:relative; display:block; width:100%; min-height:54px;
  padding:9px 12px 9px 15px; margin-bottom:2px;
  color:var(--muted); background:transparent;
  border:1px solid transparent; border-radius:14px;
  text-align:left; cursor:pointer; font:inherit;
  transition:color var(--ease),background-color var(--ease),
             border-color var(--ease),box-shadow var(--ease),transform var(--ease);
}
.nav:hover{
  color:var(--text); background:var(--surface-soft);
  border-color:var(--border); transform:translateX(2px);
}
.nav[aria-current="page"]{
  color:var(--text);
  background:linear-gradient(90deg,rgba(59,130,246,.17),rgba(34,211,238,.06));
  border-color:rgba(59,130,246,.24);
  box-shadow:inset 0 1px 0 var(--highlight),0 0 20px rgba(59,130,246,.12);
}
.nav .k{display:block; font-size:14px; font-weight:700; letter-spacing:-.01em}
.nav .d{display:block; margin-top:2px; font-size:11.5px; color:var(--subtle)}

.sideFoot{margin-top:auto; padding:14px 17px; font-size:11px; color:var(--subtle)}
.sideFoot a{color:inherit}

main{flex:1 1 auto; position:relative; min-width:0}
iframe{
  position:absolute; inset:0; width:100%; height:100%;
  border:0; background:transparent; visibility:hidden;
}
iframe.on{visibility:visible}
.load{
  position:absolute; left:50%; top:44%; transform:translateX(-50%);
  color:var(--subtle); font-size:13px;
}

/* スマホでは横に並べず、上に横スクロールのタブを出す */
@media(max-width:760px){
  body{flex-direction:column}
  #side{
    width:100%; flex-direction:row; align-items:center; gap:8px;
    overflow-x:auto; overflow-y:hidden; padding:8px 10px;
    border-right:0; border-bottom:1px solid var(--border); box-shadow:none;
  }
  .brand{height:auto; padding:0 6px 0 4px; font-size:14px; white-space:nowrap}
  .brand .brandMark{width:18px; height:18px}
  nav{display:flex; gap:6px; padding:0}
  .navSec, .sideFoot, .nav .d{display:none}
  .nav{min-height:0; width:auto; padding:8px 14px; margin:0; white-space:nowrap; border-radius:999px}
  .nav:hover{transform:none}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><span class="brandMark" aria-hidden="true"></span>ダッシュボード</div>
  <nav id="nav"></nav>
  <div class="sideFoot">
    <a id="open" href="#" target="_blank" rel="noopener">いま見ている画面を別タブで開く</a>
  </div>
</aside>

<main id="stage">
  <div class="load" id="load">読み込んでいます</div>
</main>

<script>
/* 3つのダッシュボードを1画面でまとめて見る。
   中身はそれぞれ別に公開されているページで、ここは枠に読み込むだけ。
   数字が変わってもここを直す必要はない。

   ★幹部threadsはここに入れない。見せる相手が違う。 */
var VIEWS = [
  { id: "annken", name: "案件掲載ダッシュボード", note: "Threads案件の掲載状況", url: "../annken/" },
  { id: "dm",     name: "DM管理ダッシュボード",   note: "ThreadsのDMの状況",   url: "../dm/" },
  { id: "marke",  name: "CW採用掲載",             note: "6人のCW掲載状況",     url: "../marke/" },
];

var nav = document.getElementById("nav");
var stage = document.getElementById("stage");
var load = document.getElementById("load");
var open = document.getElementById("open");
var frames = {};

/* 前回どれを見ていたかを覚える。毎回同じ画面から始めたい人が多い。
   プライベートモードなどで使えないことがあるので、失敗しても無視する。 */
function saved() { try { return localStorage.getItem("dashTab"); } catch (e) { return null; } }
function remember(id) { try { localStorage.setItem("dashTab", id); } catch (e) {} }

function show(id) {
  VIEWS.forEach(function (v) {
    var on = v.id === id;
    frames[v.id].classList.toggle("on", on);
    var b = document.getElementById("nav-" + v.id);
    if (on) { b.setAttribute("aria-current", "page"); open.href = v.url; }
    else { b.removeAttribute("aria-current"); }
  });
  remember(id);
  load.style.display = "none";
}

VIEWS.forEach(function (v) {
  var b = document.createElement("button");
  b.className = "nav";
  b.id = "nav-" + v.id;
  b.type = "button";
  b.innerHTML = '<span class="k"></span><span class="d"></span>';
  b.querySelector(".k").textContent = v.name;
  b.querySelector(".d").textContent = v.note;
  b.addEventListener("click", function () { show(v.id); });
  nav.appendChild(b);

  /* 3つとも最初に読み込む。切り替えたときに待たされないようにする。 */
  var f = document.createElement("iframe");
  f.title = v.name;
  f.src = v.url;
  stage.appendChild(f);
  frames[v.id] = f;
});

var first = saved();
if (!frames[first]) first = VIEWS[0].id;
show(first);
</script>

</body>
</html>
