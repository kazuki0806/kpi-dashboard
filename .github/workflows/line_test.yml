name: 公式LINEの導線を1人で試す

# 手動でだけ動く。指定した1人にだけ、新しいリッチメニューとあいさつ文を出す。
# 元に戻すときは mode を undo にして動かす。

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: "試す人の表示名"
        default: "池田和喜"
      test_user_id:
        description: "試す人のユーザーID（U〜。LINE Developers のチャネル基本設定「あなたのユーザーID」）"
        default: ""
      check_url:
        description: "3分チェック（message:言葉 でトーク内チェック、URLならそのページを開く）"
        default: "https://liff.line.me/2011815132-w52mWmUD"
      note_url:
        description: "note記事のURL"
        default: "https://note.com/novel_dietes168/n/na894a753e677"
      book_url:
        description: "無料相談の日程調整URL（空なら「相談」と送られる）"
        default: "https://timerex.net/s/kazuki8063825_f733/b0e0734a"
      mode:
        description: "try（1人で試す）/ default（全員に出す）/ undo（元に戻す）"
        default: "try"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 試す
        run: python3 scripts/line_test.py
        env:
          LINE_TOKEN_A: ${{ secrets.LINE_TOKEN_A }}
          TEST_NAME: ${{ inputs.test_name }}
          TEST_USER_ID: ${{ inputs.test_user_id }}
          CHECK_URL: ${{ inputs.check_url }}
          NOTE_URL: ${{ inputs.note_url }}
          BOOK_URL: ${{ inputs.book_url }}
          MODE: ${{ inputs.mode }}
