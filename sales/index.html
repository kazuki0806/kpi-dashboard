<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>売上と歩留まり</title>
<style>
/* 色はCW業務アプリに合わせている（青＋データ用の濃淡）。
   数字を詰めて見る画面なので、余白は狭め・文字は小さめ。 */
:root{
  color-scheme: light;
  --bg:#F1F5FB; --panel:#FFFFFF; --panel-2:#F7FAFF;
  --line:rgba(28,58,104,.13); --line-2:rgba(28,58,104,.22);
  --ink:#0F1B2D; --muted:#516179; --subtle:#7286A0;
  --accent:#1E40AF; --accent-2:#3B82F6; --accent-soft:#E4ECFB;
  --ok:#15803D; --ok-soft:#DCF3E4; --wait:#B45309; --wait-soft:#FBEEDA;
  --err:#B42318; --err-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(16,40,80,.06), 0 12px 28px -20px rgba(16,40,80,.45);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#080D16; --panel:#0F1826; --panel-2:#131E2F;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --ink:#E9F1FF; --muted:#9FB0C7; --subtle:#8194AC;
    --accent:#7AA9FF; --accent-2:#5B8DEF; --accent-soft:rgba(122,169,255,.14);
    --ok:#5FD08A; --ok-soft:rgba(95,208,138,.14); --wait:#F0B357; --wait-soft:rgba(240,179,87,.14);
    --err:#FF8A7A; --err-soft:rgba(255,138,122,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -22px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 56px}
.num{font-variant-numeric:tabular-nums}

/* 見出し */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.when{color:var(--muted);font-size:12.5px}
h2{font-size:13px;margin:22px 0 8px;color:var(--muted);letter-spacing:.02em;font-weight:700}

/* 数字カード */
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow)}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.card .n{font-size:11.5px;color:var(--subtle);margin-top:1px}
.card.paid{border-left:3px solid var(--ok)} .card.paid .v{color:var(--ok)}
.card.unpaid{border-left:3px solid var(--wait)} .card.unpaid .v{color:var(--wait)}
.card.bad{border-left:3px solid var(--err)} .card.bad .v{color:var(--err)}

/* 歩留まり */
.funnel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.step{display:grid;grid-template-columns:92px 1fr 108px;align-items:center;gap:10px;padding:3px 0}
.step .nm{font-size:12.5px;color:var(--muted)}
.step .bar{height:18px;border-radius:5px;background:var(--accent-soft);position:relative;overflow:hidden}
.step .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px}
.step .val{text-align:right;font-weight:700}
.step .val small{font-weight:400;color:var(--subtle);margin-left:6px}

/* 表 */
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-size:11.5px;font-weight:700;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
tbody tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.who{display:flex;align-items:center;gap:7px;font-weight:600}
.who .go{color:var(--subtle);font-size:11px}
.bar-mini{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--accent-soft);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--accent-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.paid{color:var(--ok);background:var(--ok-soft)}
.pill.unpaid{color:var(--wait);background:var(--wait-soft)}
.pill.other{color:var(--subtle);background:var(--accent-soft)}
.none{color:var(--subtle)}

/* 名前を押したときに出る明細 */
.sheet{position:fixed;inset:0;display:none;z-index:20}
.sheet[data-on="1"]{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(8,14,26,.45)}
.sheet .body{
  position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);
  background:var(--panel);border-left:1px solid var(--line-2);
  box-shadow:-24px 0 60px -30px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
  transform:translateX(12px);opacity:0;transition:transform .18s ease,opacity .18s ease;
}
.sheet[data-on="1"] .body{transform:none;opacity:1}
.sheet h3{margin:0;font-size:16px}
.sheetTop{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheetTop .sub{color:var(--muted);font-size:12px}
.sheetTop button{
  margin-left:auto;min-width:44px;min-height:44px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--panel-2);color:var(--ink);font:inherit;cursor:pointer;
}
.sheetTop button:hover{background:var(--accent-soft)}
.sheetBody{overflow:auto;padding:14px 16px 28px;display:grid;gap:14px}
.mini{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.mini div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mini .k{font-size:11px;color:var(--muted)}
.mini .v{font-size:16px;font-weight:700;margin-top:2px}
.group{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group .gh{background:var(--panel-2);padding:6px 11px;font-size:11.5px;color:var(--muted);font-weight:700;
  display:flex;justify-content:space-between}
.group ul{list-style:none;margin:0;padding:0}
.group li{display:flex;gap:10px;justify-content:space-between;padding:6px 11px;border-top:1px solid var(--line);font-size:12.5px}
.group li span.st{color:var(--subtle);font-size:11.5px;white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .sheet .body{transition:none} }
@media (max-width:640px){
  .sheet .body{width:100%}
  .step{grid-template-columns:76px 1fr 92px}
}
.foot{margin-top:22px;color:var(--subtle);font-size:11.5px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent-2);
  border-radius:var(--r);padding:11px 13px;color:var(--muted);font-size:12.5px}
.note.warn{border-left-color:var(--err)}
.note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>売上と歩留まり</h1>
    <span class="when" id="when">読み込んでいます</span>
  </header>
  <div id="app"></div>
  <p class="foot">AGシートから自動で作っています。数字を直すときはシート側を直してください。</p>
</div>

<!-- 名前を押すと出る明細 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" data-on="">
  <div class="veil" id="veil"></div>
  <div class="body">
    <div class="sheetTop">
      <div>
        <h3 id="sheetName">—</h3>
        <div class="sub" id="sheetRole"></div>
      </div>
      <button type="button" id="sheetClose" aria-label="閉じる">閉じる</button>
    </div>
    <div class="sheetBody" id="sheetBody"></div>
  </div>
</div>

<script>
var yen = function (n) { return "¥" + Number(n || 0).toLocaleString("ja-JP"); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
var pct = function (v) { return v == null ? "—" : v + "%"; };
var DATA = null, lastFocus = null;

fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(render)
  .catch(function (e) { document.getElementById("when").textContent = "データを読み込めませんでした: " + e; });

function render(d) {
  DATA = d;
  document.getElementById("when").textContent = d.month + "分 ／ " + d.generated_at + " 時点";

  var m = d.money, f = d.funnel, r = d.rates;
  var sum = m["入金済み"].金額 + m["未入金"].金額 + m["資金繰り難"].金額;
  var cnt = m["入金済み"].件数 + m["未入金"].件数 + m["資金繰り難"].件数;
  var html = "";

  html += '<div class="cards">' +
    card("入金済み", yen(m["入金済み"].金額), m["入金済み"].件数 + "件", "paid") +
    card("未入金", yen(m["未入金"].金額), m["未入金"].件数 + "件・契約済(資金繰り中)", "unpaid") +
    card("資金繰り難", yen(m["資金繰り難"].金額), m["資金繰り難"].件数 + "件", "bad") +
    card("契約の合計", yen(sum), cnt + "件", "") +
    "</div>";

  html += "<h2>率</h2><div class='cards'>" +
    card("トスアップ率", pct(r["トスアップ率"]), "見込み着座 ÷ アポ着座", "") +
    card("ブリッジ率", pct(r["ブリッジ率"]), "プレ着座 ÷ 見込み着座", "") +
    card("契約率", pct(r["契約率"]), "契約成立 ÷ プレ着座", "") +
    card("入金率", pct(r["入金率"]), "入金済み ÷ 契約成立", "") +
    "</div>";

  var names = Object.keys(f), top = f[names[0]] || 1;
  html += "<h2>歩留まり</h2><div class='funnel'>";
  names.forEach(function (n, i) {
    var prev = i ? f[names[i - 1]] : 0;
    var rate = prev ? Math.round(f[n] / prev * 1000) / 10 + "%" : "";
    html += '<div class="step"><span class="nm">' + esc(n) + "</span>" +
      '<span class="bar"><i style="width:' + (f[n] / top * 100).toFixed(1) + '%"></i></span>' +
      '<span class="val num">' + f[n] + (rate ? "<small>" + rate + "</small>" : "") + "</span></div>";
  });
  html += "</div>";

  ["トスアップ担当", "クローザー"].forEach(function (g) {
    var rows = (d.people || {})[g] || [];
    if (!rows.length) return;
    var maxSeat = Math.max.apply(null, rows.map(function (x) { return x["アポ着座"]; })) || 1;
    html += "<h2>" + esc(g) + "ごと（" + rows.length + "人・名前を押すと明細）</h2>" +
      "<div class='tw'><table><thead><tr><th>名前</th><th class='r'>アポ着座</th>" +
      "<th class='r'>見込み着座</th><th class='r'>トスアップ率</th><th class='r'>プレ着座</th>" +
      "<th class='r'>ブリッジ率</th><th class='r'>契約</th><th class='r'>入金</th>" +
      "<th class='r'>入金額</th></tr></thead><tbody>";
    rows.forEach(function (x, i) {
      html += '<tr class="click" tabindex="0" role="button" data-g="' + esc(g) + '" data-i="' + i +
        '" aria-label="' + esc(x.name) + " の明細を開く\">" +
        '<td><span class="who">' + esc(x.name) + '<span class="go">›</span></span></td>' +
        '<td class="r num"><span class="bar-mini"><i style="width:' +
          (x["アポ着座"] / maxSeat * 100).toFixed(0) + '%"></i></span>' + x["アポ着座"] + "</td>" +
        '<td class="r num">' + x["見込み着座"] + "</td>" +
        '<td class="r num">' + pct(x["トスアップ率"]) + "</td>" +
        '<td class="r num">' + x["プレ着座"] + "</td>" +
        '<td class="r num">' + pct(x["ブリッジ率"]) + "</td>" +
        '<td class="r num">' + x["契約数"] + "</td>" +
        '<td class="r num">' + x["入金済み"] + "</td>" +
        '<td class="r num">' + (x["入金額"] ? yen(x["入金額"]) : "—") + "</td></tr>";
    });
    html += "</tbody></table></div>";
  });

  html += "<h2>契約した人（" + d.contracts.length + "件）</h2><div class='tw'><table>" +
    "<thead><tr><th>クライアント</th><th>コース</th><th class='r'>金額</th><th>状況</th>" +
    "<th>リード獲得先</th><th>トスアップ</th><th>担当</th></tr></thead><tbody>";
  d.contracts.forEach(function (c) {
    html += "<tr><td>" + esc(c.client) + "</td><td>" + esc(c.course) + "</td>" +
      '<td class="r num">' + yen(c.yen) + "</td><td>" + statePill(c.state) + "</td>" +
      "<td>" + esc(c.lead) + "</td><td>" + esc(c.toss) + "</td><td>" + esc(c.closer) + "</td></tr>";
  });
  html += "</tbody></table></div>";

  var checks = [];
  Object.keys(d.check || {}).forEach(function (k) {
    (d.check[k] || []).forEach(function (row) {
      checks.push(k + "：" + row.client + "（契約者タブ " + (row["契約者タブ"] || "空欄") + "）");
    });
  });
  if (checks.length) {
    html += "<h2>要確認</h2><div class='note warn'>契約者タブと営業タブで、コースの記入が合っていません。<br>" +
      checks.map(esc).join("<br>") + "</div>";
  }

  html += "<h2>数え方</h2><div class='note'><b>アポ被り</b> は分母から外しています（" +
    (d.excluded["アポ被り"] || 0) + "件）。見込み外は「座ったが見込みが無かった人」として、アポ着座にだけ数えています。<br>" +
    d.stages.map(function (s) {
      return "<b>" + esc(s.name) + "</b>：" + s.statuses.map(esc).join("、");
    }).join("<br>") +
    (Object.keys(d.unknownStatuses || {}).length
      ? "<br><b>どの段階か決めていないステータス</b>：" + Object.keys(d.unknownStatuses).map(esc).join("、") : "") +
    "</div>";

  document.getElementById("app").innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll("tr.click"), function (tr) {
    tr.addEventListener("click", function () { openSheet(tr.dataset.g, +tr.dataset.i, tr); });
    tr.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(tr.dataset.g, +tr.dataset.i, tr); }
    });
  });
}

function statePill(state) {
  var cls = state.indexOf("入金済") === 0 ? "paid" : (state.indexOf("契約済") === 0 ? "unpaid" : "other");
  return '<span class="pill ' + cls + '">' + esc(state) + "</span>";
}

function card(k, v, n, cls) {
  return '<div class="card ' + cls + '"><div class="k">' + esc(k) + '</div><div class="v num">' +
    esc(v) + '</div><div class="n">' + esc(n) + "</div></div>";
}

/* ── 名前を押したときの明細 ───────────────────── */
function openSheet(group, index, from) {
  var x = ((DATA.people || {})[group] || [])[index];
  if (!x) return;
  lastFocus = from || null;
  document.getElementById("sheetName").textContent = x.name;
  document.getElementById("sheetRole").textContent =
    group + "として ／ " + DATA.month + "分";

  var html = '<div class="mini">' +
    mini("アポ着座", x["アポ着座"]) + mini("見込み着座", x["見込み着座"]) +
    mini("プレ着座", x["プレ着座"]) + mini("契約", x["契約数"]) +
    mini("トスアップ率", pct(x["トスアップ率"])) + mini("ブリッジ率", pct(x["ブリッジ率"])) +
    "</div>";

  if ((x["契約"] || []).length) {
    html += '<div class="group"><div class="gh"><span>契約（' + x["契約"].length + "件）</span><span>" +
      yen(x["金額"]) + "</span></div><ul>";
    x["契約"].forEach(function (c) {
      html += "<li><span>" + esc(c.client) + " <span class='st'>" + esc(c.course) + "</span></span>" +
        "<span>" + statePill(c.state) + " <span class='num'>" + yen(c.yen) + "</span></span></li>";
    });
    html += "</ul></div>";
  }

  var rows = x["明細"] || [];
  var byStage = {};
  rows.forEach(function (r) { (byStage[r.stage] = byStage[r.stage] || []).push(r); });
  var order = DATA.stages.map(function (s) { return s.name; }).reverse();
  order.forEach(function (st) {
    var list = byStage[st];
    if (!list || !list.length) return;
    html += '<div class="group"><div class="gh"><span>' + esc(st) + "</span><span>" + list.length + "件</span></div><ul>";
    list.forEach(function (r) {
      html += "<li><span>" + (esc(r.client) || "（名前なし）") + "</span>" +
        "<span class='st'>" + esc(r.status) + esc(r.tab) + "</span></li>";
    });
    html += "</ul></div>";
  });
  if (!rows.length) html += "<p class='none'>この人の行はシートにありません。</p>";

  document.getElementById("sheetBody").innerHTML = html;
  var sheet = document.getElementById("sheet");
  sheet.dataset.on = "1";
  document.body.style.overflow = "hidden";
  document.getElementById("sheetClose").focus();
}

function mini(k, v) {
  return '<div><div class="k">' + esc(k) + '</div><div class="v num">' + esc(v) + "</div></div>";
}

function closeSheet() {
  document.getElementById("sheet").dataset.on = "";
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("veil").addEventListener("click", closeSheet);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && document.getElementById("sheet").dataset.on === "1") closeSheet();
});
</script>
</body>
</html>
